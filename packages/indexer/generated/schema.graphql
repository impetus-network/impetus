  contract_not_in: [String]
  contract_contains: String
  contract_not_contains: String
  contract_starts_with: String
  contract_ends_with: String
  contract_not_starts_with: String
  contract_not_ends_with: String
  selector: String
  selector_not: String
  selector_in: [String]
  selector_not_in: [String]
  selector_contains: String
  selector_not_contains: String
  selector_starts_with: String
  selector_ends_with: String
  selector_not_starts_with: String
  selector_not_ends_with: String
  enabled: Boolean
