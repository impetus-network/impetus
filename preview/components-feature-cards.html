<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:var(--canvas);display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.card{border-radius:var(--radius-xl);padding:24px;font-family:var(--font-body);}
.title{font-weight:600;font-size:18px;margin-bottom:8px;line-height:1.3;}
.body{font-size:13px;line-height:1.5;opacity:0.85;}
.pink{background:#ff4d8b;color:#fff;}
.teal{background:#1a3a3a;color:#fff;}
.lav{background:#b8a4ed;color:#0a0a0a;}
.peach{background:#ffb084;color:#0a0a0a;}
.ochre{background:#e8b94a;color:#0a0a0a;}
.cream{background:#f5f0e0;color:#0a0a0a;}
</style></head><body>
<div class="card pink"><div class="title">Outbound that lands</div><div class="body">Sequencer with the data you actually have.</div></div>
<div class="card teal"><div class="title">Enterprise-grade</div><div class="body">SOC 2 · SSO · audit logs.</div></div>
<div class="card lav"><div class="title">AI research agents</div><div class="body">Tell Claygent what to find.</div></div>
<div class="card peach"><div class="title">100+ data providers</div><div class="body">Enrich any record, end-to-end.</div></div>
<div class="card ochre"><div class="title">Expert network</div><div class="body">Book a Clay expert in minutes.</div></div>
<div class="card cream"><div class="title">Templates</div><div class="body">Start with a proven workflow.</div></div>
</body></html>
