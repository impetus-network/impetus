<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--canvas);}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
.sw{display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
.swatch{height:64px;width:100%;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-family:var(--font-body);font-weight:500;font-size:14px;}
.lbl{font-size:11px;color:var(--ink);font-weight:600;}
.hex{font-family:var(--font-mono);font-size:10px;color:var(--muted);}
</style></head><body>
<div class="row">
  <div class="sw"><div class="swatch" style="background:#0a0a0a;color:#fff">Aa</div><div class="lbl">Ink / Primary</div><div class="hex">#0a0a0a</div></div>
  <div class="sw"><div class="swatch" style="background:#1a1a1a;color:#fff">Aa</div><div class="lbl">Body strong</div><div class="hex">#1a1a1a</div></div>
  <div class="sw"><div class="swatch" style="background:#3a3a3a;color:#fff">Aa</div><div class="lbl">Body</div><div class="hex">#3a3a3a</div></div>
  <div class="sw"><div class="swatch" style="background:#6a6a6a;color:#fff">Aa</div><div class="lbl">Muted</div><div class="hex">#6a6a6a</div></div>
  <div class="sw"><div class="swatch" style="background:#9a9a9a;color:#fff">Aa</div><div class="lbl">Muted soft</div><div class="hex">#9a9a9a</div></div>
</div>
</body></html>
