<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--canvas);}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;align-items:end;}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;}
.tile{width:72px;height:72px;background:var(--brand-lavender);border:1px solid var(--hairline);}
.tag{font-family:var(--font-body);font-size:11px;color:var(--ink);font-weight:600;}
.lbl{font-family:var(--font-mono);font-size:10px;color:var(--muted);}
</style></head><body>
<div class="row">
  <div class="col"><div class="tile" style="border-radius:6px"></div><div class="tag">xs</div><div class="lbl">6px</div></div>
  <div class="col"><div class="tile" style="border-radius:8px"></div><div class="tag">sm</div><div class="lbl">8px</div></div>
  <div class="col"><div class="tile" style="border-radius:12px"></div><div class="tag">md</div><div class="lbl">12px</div></div>
  <div class="col"><div class="tile" style="border-radius:16px"></div><div class="tag">lg</div><div class="lbl">16px</div></div>
  <div class="col"><div class="tile" style="border-radius:24px"></div><div class="tag">xl</div><div class="lbl">24px</div></div>
  <div class="col"><div class="tile" style="border-radius:9999px"></div><div class="tag">pill</div><div class="lbl">∞</div></div>
</div>
</body></html>
