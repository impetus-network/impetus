<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--canvas);}
.row{display:flex;align-items:flex-end;gap:16px;}
.box{background:var(--brand-peach);border-radius:6px;}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;}
.lbl{font-family:var(--font-mono);font-size:10px;color:var(--muted);}
.tag{font-family:var(--font-body);font-size:11px;color:var(--ink);font-weight:600;}
</style></head><body>
<div class="row">
  <div class="col"><div class="box" style="width:4px;height:36px"></div><div class="tag">xxs</div><div class="lbl">4</div></div>
  <div class="col"><div class="box" style="width:8px;height:36px"></div><div class="tag">xs</div><div class="lbl">8</div></div>
  <div class="col"><div class="box" style="width:12px;height:36px"></div><div class="tag">sm</div><div class="lbl">12</div></div>
  <div class="col"><div class="box" style="width:16px;height:36px"></div><div class="tag">md</div><div class="lbl">16</div></div>
  <div class="col"><div class="box" style="width:24px;height:36px"></div><div class="tag">lg</div><div class="lbl">24</div></div>
  <div class="col"><div class="box" style="width:32px;height:36px"></div><div class="tag">xl</div><div class="lbl">32</div></div>
  <div class="col"><div class="box" style="width:48px;height:36px"></div><div class="tag">xxl</div><div class="lbl">48</div></div>
  <div class="col"><div class="box" style="width:96px;height:36px;background:var(--brand-pink)"></div><div class="tag">section</div><div class="lbl">96</div></div>
</div>
</body></html>
