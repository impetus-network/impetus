<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--canvas);display:flex;flex-direction:column;gap:14px;}
.row{display:flex;align-items:center;gap:16px;}
.meta{font-family:var(--font-mono);font-size:10px;color:var(--muted);min-width:180px;}
.cap{font-family:var(--font-body);font-weight:500;font-size:13px;color:var(--ink);}
.capu{font-family:var(--font-body);font-weight:600;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);}
.btn{font-family:var(--font-body);font-weight:600;font-size:14px;background:var(--primary);color:#fff;padding:12px 20px;border-radius:var(--radius-md);}
.nav{font-family:var(--font-body);font-weight:500;font-size:14px;color:var(--ink);}
</style></head><body>
<div class="row"><div class="meta">caption · 13/500</div><div class="cap">New · Featured</div></div>
<div class="row"><div class="meta">caption-uppercase · 12/600/+1.5</div><div class="capu">Featured</div></div>
<div class="row"><div class="meta">button · 14/600</div><div class="btn">Try free</div></div>
<div class="row"><div class="meta">nav-link · 14/500</div><div class="nav">Product · Solutions · Resources · Pricing</div></div>
</body></html>
