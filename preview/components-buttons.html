<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:var(--canvas);display:flex;flex-direction:column;gap:16px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.tile{padding:18px;border-radius:var(--radius-lg);display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.lbl{font-family:var(--font-body);font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:1px;}
.btn{font-family:var(--font-body);font-weight:600;font-size:14px;border:none;cursor:pointer;border-radius:var(--radius-md);padding:12px 20px;height:44px;display:inline-flex;align-items:center;gap:8px;}
.primary{background:#0a0a0a;color:#fff;}
.primary-active{background:#1f1f1f;color:#fff;}
.disabled{background:#e5e5e5;color:#9a9a9a;cursor:not-allowed;}
.secondary{background:#fffaf0;color:#0a0a0a;border:1px solid #e5e5e5;}
.text{background:transparent;color:#0a0a0a;padding:12px 8px;}
.on-color{background:#fffaf0;color:#0a0a0a;}
.on-dark{background:#fffaf0;color:#0a0a0a;}
</style></head><body>

<div>
  <div class="lbl" style="margin-bottom:8px">On canvas</div>
  <div class="row">
    <button class="btn primary">Try free</button>
    <button class="btn primary-active">Try free</button>
    <button class="btn disabled">Try free</button>
    <button class="btn secondary">Book a demo</button>
    <button class="btn text">Sign in →</button>
  </div>
</div>

<div class="tile" style="background:#ff4d8b">
  <div class="lbl" style="color:rgba(255,255,255,0.85);width:100%">On pink card · button-on-color</div>
  <button class="btn on-color">Try free</button>
  <button class="btn" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.4)">Learn more</button>
</div>

<div class="tile" style="background:#1a3a3a">
  <div class="lbl" style="color:rgba(255,255,255,0.7);width:100%">On teal card · button-on-color</div>
  <button class="btn on-dark">Get a demo</button>
  <button class="btn" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.3)">See pricing</button>
</div>

<div class="tile" style="background:#ffb084">
  <div class="lbl" style="color:rgba(10,10,10,0.65);width:100%">On peach card · button-on-color</div>
  <button class="btn primary">Try free</button>
  <button class="btn on-color" style="border:1px solid rgba(10,10,10,0.12)">Watch demo</button>
</div>

</body></html>
