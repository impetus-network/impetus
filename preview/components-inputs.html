<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--canvas);display:flex;flex-direction:column;gap:14px;}
.input{font-family:var(--font-body);font-size:16px;background:#fffaf0;color:#0a0a0a;border:1px solid #e5e5e5;border-radius:var(--radius-md);padding:12px 16px;height:44px;width:100%;box-sizing:border-box;outline:none;}
.input.focused{border-color:#0a0a0a;border-width:1.5px;}
.lbl{font-family:var(--font-body);font-weight:600;font-size:13px;color:var(--ink);margin-bottom:6px;}
.field{display:flex;flex-direction:column;}
.err{color:#ef4444;font-size:12px;margin-top:6px;font-family:var(--font-body);}
</style></head><body>
<div class="field"><div class="lbl">Work email</div><input class="input" placeholder="you@company.com"/></div>
<div class="field"><div class="lbl">Company</div><input class="input focused" value="Clay"/></div>
<div class="field"><div class="lbl">Domain</div><input class="input" value="not-a-domain" style="border-color:#ef4444"/><div class="err">Enter a valid domain.</div></div>
</body></html>
