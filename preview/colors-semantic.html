<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--canvas);}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.sw{display:flex;flex-direction:column;gap:6px;}
.chip{height:72px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-family:var(--font-body);font-size:14px;}
.lbl{font-size:11px;color:var(--ink);font-weight:600;}
.hex{font-family:var(--font-mono);font-size:10px;color:var(--muted);}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#22c55e">Success</div><div class="lbl">Success</div><div class="hex">#22c55e</div></div>
  <div class="sw"><div class="chip" style="background:#f59e0b">Warning</div><div class="lbl">Warning</div><div class="hex">#f59e0b</div></div>
  <div class="sw"><div class="chip" style="background:#ef4444">Error</div><div class="lbl">Error</div><div class="hex">#ef4444</div></div>
</div>
</body></html>
