<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--canvas);}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;}
.sw{display:flex;flex-direction:column;gap:6px;}
.chip{height:72px;border-radius:var(--radius-md);border:1px solid var(--hairline);}
.lbl{font-size:11px;color:var(--ink);font-weight:600;}
.hex{font-family:var(--font-mono);font-size:10px;color:var(--muted);}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#ff4d8b"></div><div class="lbl">Pink</div><div class="hex">#ff4d8b</div></div>
  <div class="sw"><div class="chip" style="background:#1a3a3a"></div><div class="lbl">Teal</div><div class="hex">#1a3a3a</div></div>
  <div class="sw"><div class="chip" style="background:#b8a4ed"></div><div class="lbl">Lavender</div><div class="hex">#b8a4ed</div></div>
  <div class="sw"><div class="chip" style="background:#ffb084"></div><div class="lbl">Peach</div><div class="hex">#ffb084</div></div>
  <div class="sw"><div class="chip" style="background:#e8b94a"></div><div class="lbl">Ochre</div><div class="hex">#e8b94a</div></div>
  <div class="sw"><div class="chip" style="background:#a4d4c5"></div><div class="lbl">Mint</div><div class="hex">#a4d4c5</div></div>
</div>
</body></html>
