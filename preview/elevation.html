<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:32px 24px;background:var(--canvas);}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
.col{display:flex;flex-direction:column;align-items:center;gap:10px;}
.tile{width:120px;height:72px;background:var(--canvas);border-radius:var(--radius-lg);border:1px solid var(--hairline);}
.tag{font-family:var(--font-body);font-size:11px;color:var(--ink);font-weight:600;}
.lbl{font-family:var(--font-mono);font-size:10px;color:var(--muted);text-align:center;max-width:140px;}
</style></head><body>
<div class="row">
  <div class="col"><div class="tile"></div><div class="tag">Flat</div><div class="lbl">No shadow · default</div></div>
  <div class="col"><div class="tile" style="box-shadow:0 1px 2px rgba(10,10,10,0.04)"></div><div class="tag">Soft</div><div class="lbl">Hairline-quiet</div></div>
  <div class="col"><div class="tile" style="box-shadow:0 8px 24px rgba(10,10,10,0.06)"></div><div class="tag">Hover</div><div class="lbl">Rare · cards on hover</div></div>
</div>
</body></html>
