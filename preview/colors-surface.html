<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--canvas);}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
.sw{display:flex;flex-direction:column;gap:6px;}
.chip{height:72px;border-radius:var(--radius-md);border:1px solid var(--hairline);}
.lbl{font-size:11px;color:var(--ink);font-weight:600;}
.hex{font-family:var(--font-mono);font-size:10px;color:var(--muted);}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#fffaf0"></div><div class="lbl">Canvas</div><div class="hex">#fffaf0</div></div>
  <div class="sw"><div class="chip" style="background:#faf5e8"></div><div class="lbl">Surface soft</div><div class="hex">#faf5e8</div></div>
  <div class="sw"><div class="chip" style="background:#f5f0e0"></div><div class="lbl">Surface card</div><div class="hex">#f5f0e0</div></div>
  <div class="sw"><div class="chip" style="background:#ebe6d6"></div><div class="lbl">Surface strong</div><div class="hex">#ebe6d6</div></div>
  <div class="sw"><div class="chip" style="background:#0a1a1a"></div><div class="lbl">Surface dark</div><div class="hex">#0a1a1a</div></div>
</div>
</body></html>
