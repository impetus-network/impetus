# Squid schema (squid-typeorm-codegen dialect). `sqd codegen` generates
# src/model/generated from this. Addresses are 0x-hex (AccountId20 = H160).

type Validator @entity {
  id: ID! # stash address (0x…)
  commission: Int! # percent (0..100)
  blocked: Boolean!
  active: Boolean! # validator intent live (true on ValidatePrefsSet, false on Chilled)
  elected: Boolean! # in the current era's elected set (from Session.Validators)
  selfBonded: BigInt!
  blocksProduced: Int! # blocks authored (from each block's author) — real activity metric
  lastBlock: Int # height of the most recent block this validator authored
  updatedAt: Int! # block height
}

type Nominator @entity {
  id: ID! # stash address
  targets: [String!]! # validator stash addresses
  active: Boolean!
  updatedAt: Int!
}

type Era @entity {
  id: ID! # era index as string
  index: Int!
  validatorReward: BigInt
  startBlock: Int!
}

type Payout @entity {
  id: ID! # `${validator}-${era}`
  validator: String! @index
  era: Int!
  block: Int!
}

type Pool @entity {
  id: ID! # pool id
  creator: String!
  state: String! # Open | Blocked | Destroying
  createdBlock: Int!
  updatedAt: Int!
}

type PoolMember @entity {
  id: ID! # member address
  poolId: Int! @index
  bonded: BigInt!
  lastClaimBlock: Int
  updatedAt: Int!
}

# Raw stake activity log (Bonded / Unbonded / Withdrawn / Rewarded / Slashed).
type StakeEvent @entity {
  id: ID!
  account: String! @index
  kind: String!
  amount: BigInt!
  block: Int!
  timestamp: DateTime!
}

# Gasless registry rules (pallet-gasless-registry emits GaslessRegistry.RuleSet
# / RuleRemoved substrate events — same data as the EVM logs Ponder used).
type GaslessRule @entity {
  id: ID! # `${contract}-${selector}`
  contract: String! @index
  selector: String!
  enabled: Boolean!
  minValue: BigInt!
  updatedAtBlock: Int!
}

# Native (IPT) transfers. Captures EVERY value move — EOA->EOA, EOA->contract,
# and contract->contract INTERNAL transfers — because Frontier routes all EVM
# value through pallet_balances::Currency::transfer (one Balances.Transfer per
# hop). No debug/trace stack required.
type Transfer @entity {
  id: ID!
  from: String! @index
  to: String! @index
  amount: BigInt!
  block: Int!
  timestamp: DateTime!
  extrinsicHash: String
}

# Native (IPT) holders. Balance is read AUTHORITATIVELY from System.Account
# storage (free + reserved), never derived from Transfer deltas — genesis,
# fees, rewards and slashing never all surface as Balances.Transfer events.
# Pattern: balance events flag which accounts changed in a block, then the
# processor reads System.Account for that set at the block (plus a one-time
# full-storage seed scan so genesis-funded accounts appear immediately).
type Holder @entity {
  id: ID! # account address (0x…, AccountId20)
  free: BigInt!
  reserved: BigInt!
  frozen: BigInt! # locks on free — the explorer's "locked" balance
  total: BigInt! @index # free + reserved — the value the holders ranking sorts on
  nonce: Int!
  updatedAt: Int! # block height of the last balance read
}

# EVM block (Frontier: substrate height == EVM block number, 1:1). Sourced via
# canonical eth_getBlockByNumber against the archive node — powers the explorer's
# block list + block detail in the dApp.
type Block @entity {
  id: ID! # height as string
  height: Int! @index # ordering + lookup-by-number
  hash: String! @index # lookup / search by block hash
  parentHash: String!
  timestamp: DateTime! @index
  author: String # block author / miner (0x H160)
  gasUsed: BigInt!
  gasLimit: BigInt!
  size: BigInt!
  txCount: Int!
  baseFeePerGas: BigInt
}

# EVM transaction (one per Ethereum.transact extrinsic), sourced from
# eth_getBlockByNumber + eth_getBlockReceipts. Powers tx detail and the
# per-block / per-address transaction lists (filter on from/to).
type EvmTransaction @entity {
  id: ID! # tx hash (0x…64), case-as-returned by eth RPC
  block: Int! @index
  timestamp: DateTime!
  txIndex: Int!
  from: String! @index
  to: String @index # null for contract-creation
  value: BigInt!
  input: String!
  nonce: Int!
  gasUsed: BigInt!
  gasPrice: BigInt!
  effectiveGasPrice: BigInt! # fee = gasUsed * effectiveGasPrice
  cumulativeGasUsed: BigInt!
  maxFeePerGas: BigInt
  maxPriorityFeePerGas: BigInt
  txType: Int
  success: Boolean!
  contractCreated: String @index # created contract address (null if not a deploy)
}

# Chain-wide singleton (id = "singleton"): supply + holder count for the
# explorer header and per-holder percentage of supply.
type ChainStat @entity {
  id: ID!
  totalIssuance: BigInt!
  holdersCount: Int!
  seeded: Boolean! # true once the full System.Account seed scan has run
  updatedAt: Int!
}
