services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-impetus_squid}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
    # Internal only — reached by processor/graphql over the compose default
    # network as `db:5432`. Not exposed to the host.
    volumes:
      - pgdata:/var/lib/postgresql/data

  processor:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      RPC_ENDPOINT: ${RPC_ENDPOINT}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-impetus_squid}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
    # Apply migrations, then run the processor.
    command: sh -c "npx squid-typeorm-migration apply && node -r dotenv/config lib/main.js"

  graphql:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-impetus_squid}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      GQL_PORT: "4350"
    # Serve the GraphQL API (NOT the processor entrypoint — without this it
    # falls back to the Dockerfile CMD `node lib/main.js` and crash-loops on the
    # missing RPC_ENDPOINT).
    command: npx squid-graphql-server
    # On `default` (to reach db) AND `dokploy-network` so Dokploy's Traefik can
    # route the configured domain (indexer.impetus.network) to port 4350.
    # No host port binding — Traefik handles ingress.
    networks:
      - default
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  pgdata:
