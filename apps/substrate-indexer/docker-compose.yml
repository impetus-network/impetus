services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-impetus_squid}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
    # Internal only — reached by processor/graphql over the compose default
    # network as `db:5432`. Not exposed to the host.
    volumes:
      - pgdata4:/var/lib/postgresql/data

  processor:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      RPC_ENDPOINT: ${RPC_ENDPOINT}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-impetus_squid}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
    # Apply migrations, then run the processor.
    command: sh -c "npx squid-typeorm-migration apply && node -r dotenv/config lib/main.js"

  graphql:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-impetus_squid}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      GQL_PORT: "4350"
    # Serve the GraphQL API (NOT the processor entrypoint — without this it
    # falls back to the Dockerfile CMD `node lib/main.js` and crash-loops on the
    # missing RPC_ENDPOINT).
    #
    # `--dumb-cache in-memory` gives Apollo a bounded InMemoryLRUCache (default
    # 50mb) for the automatic-persisted-queries store. Without it the APQ cache
    # is unbounded -> memory-exhaustion DoS (Apollo's "persisted queries are
    # using an unbounded cache" warning). `--dumb-cache-max-age 0` keeps the
    # cache bounded for APQ but disables response caching so indexer data stays
    # fresh.
    command: npx squid-graphql-server --dumb-cache in-memory --dumb-cache-max-age 0
    # On `default` (to reach db) AND `dokploy-network` so Dokploy's Traefik can
    # route the configured domain (indexer.impetus.network) to port 4350.
    # No host port binding — Traefik handles ingress.
    networks:
      - default
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  # pgdata4: fresh volume for the clean 1B-genesis relaunch (0x4fa5…daeb, fresh
  # block history) — forces a clean DB so the processor re-syncs from block 0.
  pgdata4:
