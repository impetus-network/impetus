	"sp-offchain/std",
	"sp-runtime/std",
	"sp-session/std",
	"sp-std/std",
	"sp-transaction-pool/std",
	"sp-version/std",
	"substrate-wasm-builder",
	"frame-benchmarking?/std",
	"frame-executive/std",
	"frame-support/std",
	"frame-system/std",
	"frame-system-benchmarking?/std",
	"frame-system-rpc-runtime-api/std",
	"pallet-session-benchmarking?/std",
	"pallet-offences-benchmarking?/std",
	"pallet-nomination-pools-benchmarking?/std",
	"pallet-election-provider-support-benchmarking?/std",
	"pallet-assets/std",
	"pallet-authorship/std",
	"pallet-babe/std",
	"pallet-balances/std",
	"pallet-grandpa/std",
	"pallet-sudo/std",
	"pallet-timestamp/std",
	"pallet-transaction-payment/std",
	"pallet-transaction-payment-rpc-runtime-api/std",
	"pallet-staking/std",
	"pallet-session/std",
	"pallet-offences/std",
	"pallet-bags-list/std",
	"pallet-election-provider-multi-phase/std",
	"frame-election-provider-support/std",
	"pallet-nomination-pools/std",
	"pallet-nomination-pools-runtime-api/std",
	"pallet-staking-runtime-api/std",
	"pallet-treasury/std",
	"pallet-fast-unstake/std",
	"pallet-vesting/std",
	"sp-staking/std",
	"sp-npos-elections/std",
	"pallet-gasless-registry/std",
	"precompile-gasless-registry/std",
	"fp-account/std",
	"fp-evm/std",
	"fp-rpc/std",
	"fp-self-contained/std",
	"pallet-base-fee/std",
	"pallet-dynamic-fee/std",
	"pallet-ethereum/std",
	"pallet-evm/std",
	"pallet-evm-chain-id/std",
	"pallet-evm-precompile-modexp/std",
	"pallet-evm-precompile-sha3fips/std",
	"pallet-evm-precompile-sha3fips-benchmarking/std",
	"pallet-evm-precompile-simple/std",
	"pallet-evm-precompile-curve25519/std",
	"pallet-evm-precompile-curve25519-benchmarking/std",
	"polkadot-runtime-common/std",
	"cumulus-pallet-weight-reclaim/std",
]
runtime-test-fast = [
	"runtime-common/runtime-test-fast",
]
runtime-benchmarks = [
	"runtime-common/runtime-benchmarks",
	"frame-benchmarking/runtime-benchmarks",
	"frame-system-benchmarking/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"frame-election-provider-support/runtime-benchmarks",
	"pallet-assets/runtime-benchmarks",
	"pallet-babe/runtime-benchmarks",
	"pallet-bags-list/runtime-benchmarks",
	"pallet-balances/runtime-benchmarks",
	"pallet-election-provider-multi-phase/runtime-benchmarks",
	"pallet-election-provider-support-benchmarking/runtime-benchmarks",
	"pallet-fast-unstake/runtime-benchmarks",
