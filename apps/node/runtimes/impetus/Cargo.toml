[package]
name = "impetus-runtime"
version = "0.0.0"
license = "Unlicense"
description = "Impetus mainnet runtime (chain id 388266)."
publish = false
authors = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
runtime-common = { path = "../common", default-features = false }
environmental = { workspace = true }
ethereum = { workspace = true }
hex-literal = { workspace = true }
scale-codec = { workspace = true }
scale-info = { workspace = true }
serde_json = { workspace = true, default-features = false, features = ["alloc"] }

# Substrate
sp-api = { workspace = true }
sp-block-builder = { workspace = true }
sp-consensus-babe = { workspace = true, default-features = false }
sp-consensus-grandpa = { workspace = true }
pallet-im-online = { workspace = true, default-features = false }
pallet-authority-discovery = { workspace = true, default-features = false }
sp-authority-discovery = { workspace = true, default-features = false }
sp-core = { workspace = true }
sp-genesis-builder = { workspace = true }
sp-inherents = { workspace = true }
sp-offchain = { workspace = true }
sp-runtime = { workspace = true }
sp-session = { workspace = true }
sp-std = { workspace = true }
sp-transaction-pool = { workspace = true }
sp-version = { workspace = true }
# FRAME
frame-benchmarking = { workspace = true, optional = true }
frame-executive = { workspace = true }
frame-support = { workspace = true, features = ["experimental"] }
frame-system = { workspace = true }
frame-system-benchmarking = { workspace = true, optional = true }
# NPoS bench helper crates — only linked when the `runtime-benchmarks` feature
# is enabled. Required by `define_benchmarks!` entries for pallet-session,
# pallet-offences, pallet-nomination-pools, and the EPM unsigned-tx benchmarks.
pallet-session-benchmarking = { workspace = true, optional = true }
pallet-offences-benchmarking = { workspace = true, optional = true }
pallet-nomination-pools-benchmarking = { workspace = true, optional = true }
pallet-election-provider-support-benchmarking = { workspace = true, optional = true }
frame-system-rpc-runtime-api = { workspace = true }
pallet-assets = { workspace = true }
pallet-authorship = { workspace = true, default-features = false }
pallet-babe = { workspace = true, default-features = false }
pallet-balances = { workspace = true, features = ["insecure_zero_ed"] }
pallet-grandpa = { workspace = true }
pallet-sudo = { workspace = true }
pallet-timestamp = { workspace = true }
pallet-transaction-payment = { workspace = true }
pallet-transaction-payment-rpc-runtime-api = { workspace = true }
pallet-staking                       = { workspace = true }
pallet-staking-reward-curve          = { workspace = true }
pallet-session                       = { workspace = true, features = ["historical"] }
pallet-offences                      = { workspace = true }
pallet-bags-list                     = { workspace = true }
pallet-election-provider-multi-phase = { workspace = true }
frame-election-provider-support      = { workspace = true }
pallet-nomination-pools              = { workspace = true }
pallet-nomination-pools-runtime-api  = { workspace = true }
pallet-staking-runtime-api           = { workspace = true }
pallet-treasury                      = { workspace = true }
pallet-fast-unstake                  = { workspace = true }
pallet-vesting                       = { workspace = true }
sp-staking                           = { workspace = true }
sp-npos-elections                    = { workspace = true }
# Local
pallet-gasless-registry = { workspace = true }
precompile-gasless-registry = { workspace = true }
# Frontier
fp-account = { workspace = true, features = ["serde"] }
fp-evm = { workspace = true, features = ["serde"] }
fp-rpc = { workspace = true }
fp-self-contained = { workspace = true, features = ["serde"] }
pallet-base-fee = { workspace = true }
pallet-dynamic-fee = { workspace = true }
pallet-ethereum = { workspace = true }
pallet-evm = { workspace = true }
pallet-evm-chain-id = { workspace = true }
pallet-evm-precompile-curve25519 = { workspace = true }
pallet-evm-precompile-curve25519-benchmarking = { workspace = true }
pallet-evm-precompile-modexp = { workspace = true }
pallet-evm-precompile-sha3fips = { workspace = true }
pallet-evm-precompile-sha3fips-benchmarking = { workspace = true }
pallet-evm-precompile-simple = { workspace = true }
# Polkadot
polkadot-runtime-common = { workspace = true }
# Cumulus
cumulus-pallet-weight-reclaim = { workspace = true }

[build-dependencies]
substrate-wasm-builder = { workspace = true, optional = true }

[dev-dependencies]
# Integration test harness only — `sp-io::TestExternalities` is not reachable
# from the regular `[dependencies]` since the runtime itself does not use it.
sp-io = { workspace = true, default-features = true }

[features]
default = ["std", "with-paritydb-weights"]
with-rocksdb-weights = ["runtime-common/with-rocksdb-weights"]
with-paritydb-weights = ["runtime-common/with-paritydb-weights"]
std = [
	"runtime-common/std",
	"environmental/std",
	"ethereum/std",
	"scale-codec/std",
	"scale-info/std",
