	"precompile-staking-admin/std",
	"environmental/std",
	"ethereum/std",
	"sp-staking/std",
	"sp-npos-elections/std",
	"pallet-staking/std",
	"frame-election-provider-support/std",
	"pallet-bags-list/std",
	"pallet-session/std",
	"pallet-nomination-pools/std",
	"pallet-fast-unstake/std",
	"pallet-treasury/std",
