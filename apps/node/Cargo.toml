[workspace]
members = [
	"node",
	"runtimes/common",
	"runtimes/impetus",
	"runtimes/impulse",
	"pallets/gasless-registry",
	"precompiles/gasless-registry",
	"precompiles/batch",
	"precompiles/staking",
	"precompiles/session",
	"precompiles/nomination-pools",
	"precompiles/fast-unstake",
	"precompiles/treasury",
	"precompiles/bags-list",
	"precompiles/staking-admin",
]
resolver = "2"

[workspace.package]
authors = ["Blockchain developers"]
edition = "2021"
repository = "https://github.com/polkadot-evm/frontier/"

[workspace.dependencies]
async-trait = "0.1"
bitflags = "1.3.2"
bn = { package = "substrate-bn", version = "0.6", default-features = false }
clap = { version = "4.5", features = ["derive", "deprecated"] }
const-hex = { version = "1.14", default-features = false, features = ["alloc"] }
derive_more = "1.0"
environmental = { version = "1.1.4", default-features = false }
ethereum = { version = "0.18.2", default-features = false }
ethereum-types = { version = "0.15", default-features = false }
evm = { git = "https://github.com/rust-ethereum/evm.git", branch = "v0.x", default-features = false }
futures = "0.3.31"
hash-db = { version = "0.16.0", default-features = false }
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
hex-literal = "0.4.1"
impl-serde = { version = "0.5.0", default-features = false }
impl-trait-for-tuples = "0.2.3"
jsonrpsee = { version = "0.24.10" }
jsonrpsee-core = { version = "0.24.10" }
kvdb-rocksdb = "0.21.0"
libsecp256k1 = { version = "0.7.2", default-features = false }
log = { version = "0.4.27", default-features = false }
num_enum = { version = "0.7.6", default-features = false }
parity-db = "0.5.4"
parking_lot = "0.12.3"
proc-macro2 = "1.0.101"
quote = "1.0.38"
rlp = { version = "0.6", default-features = false }
scale-codec = { package = "parity-scale-codec", version = "3.7.5", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
similar-asserts = "1.7.0"
sqlx = { version = "0.8.6", default-features = false, features = ["macros"] }
syn = "2.0.87"
thiserror = "2.0"
tokio = { version = "1.45.0", default-features = false }

