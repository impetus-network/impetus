services:
  explorer:
    build:
      context: ../../
      dockerfile: infra/explorer/Dockerfile
    environment:
      # Point at the Subsquid Postgres (impetus_squid): the substrate-indexer now
      # writes the four Subscan-shape tables the explorer reads there
      # (evm_blocks / evm_transactions / balance_accounts / evm_contracts).
      # Prefer a read-only role, e.g.
      #   postgresql://explorer_readonly:***@<squid-postgres>:5432/impetus_squid
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_CHAIN_ID: 388266
      NEXT_PUBLIC_CHAIN_NAME: Impetus
      NEXT_PUBLIC_TOKEN_SYMBOL: IPT
      NEXT_PUBLIC_TOKEN_DECIMALS: 18
      NEXT_PUBLIC_EXPLORER_URL: ${EXPLORER_URL:-}
    ports:
      - "${EXPLORER_PORT:-3002}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
